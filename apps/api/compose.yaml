name: esim-erp-api

services:
  api:
    image: ${BACKEND_IMAGE:?Select a reviewed backend image by digest or full commit SHA}
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - ${API_ENV_FILE:?Select an absolute path to the private API environment file}
    environment:
      APP_ENV: production
      ALLOW_DEMO_PAYMENTS: "false"
      PORT: "3011"
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3011}:3011"
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:3011/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [esim-erp-network]

  worker:
    image: ${BACKEND_IMAGE:?Select a reviewed backend image by digest or full commit SHA}
    command: ["bun", "/app/server.js", "--worker"]
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    env_file:
      - ${API_ENV_FILE:?Select an absolute path to the private API environment file}
    environment:
      APP_ENV: production
      ALLOW_DEMO_PAYMENTS: "false"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [esim-erp-network]

networks:
  esim-erp-network:
    external: true
