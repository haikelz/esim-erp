name: esim-erp-web

services:
  web:
    image: ${FRONTEND_IMAGE:?Select a reviewed frontend image by digest or full commit SHA}
    init: true
    restart: unless-stopped
    env_file:
      - ${WEB_ENV_FILE:?Select an absolute path to the private web environment file}
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 0.0.0.0
      PORT: "3010"
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3010}:3010"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3010/auth/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [esim-erp-network]

networks:
  esim-erp-network:
    external: true
