services:
  esim-erp-postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    container_name: esim-erp-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Select the maintenance owner login}
      POSTGRES_DB: ${POSTGRES_DB:?Select the database name}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command:
      ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=40"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    env_file:
      - .env
    ports:
      - "5433:5432"
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - esim-erp-network

volumes:
  postgres_data:

networks:
  esim-erp-network:
    external: true
