name: esim-erp-local
services:
  postgres:
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    ports: ['127.0.0.1:55440:5432']
    environment:
      POSTGRES_DB: esim_erp
      POSTGRES_USER: esim_erp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run bun run setup:local first}
    volumes: ['postgres_data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U esim_erp -d esim_erp']
      interval: 5s
      timeout: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.31.5
    ports: ['127.0.0.1:8029:8025']
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.43.4
    ports: ['127.0.0.1:5679:5678']
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: 'false'
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Run bun run setup:local first}
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_VERSION_NOTIFICATIONS_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
      GENERIC_TIMEZONE: Asia/Jakarta
      TZ: Asia/Jakarta
    volumes:
      - n8n_data:/home/node/.n8n
      - ./automation/n8n:/workflows:ro
      - ./.amp/in/n8n:/bootstrap:ro
    extra_hosts: ['host.docker.internal:host-gateway']
    depends_on: ['mailpit']
volumes:
  postgres_data:
  n8n_data:
